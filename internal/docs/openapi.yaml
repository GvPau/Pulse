openapi: 3.0.3

info:
  title: Pulse API
  description: |
    Backend API for the Pulse uptime monitoring service.

    All resources are user-scoped: endpoints under a JWT return only the
    authenticated user's data and 404 (not 403) when a resource belongs to
    someone else.

    - Errors follow a single contract: `{"error":{"code","message","details"}}`.
    - List endpoints paginate with `?page=&limit=` and return an envelope:
      `{"data":[...],"pagination":{"page","limit","total","has_more"}}`.
    - Interactive docs are served by this same API at `GET /docs`.
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Monitors
  - name: Incidents
  - name: Stream

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Always returns 200 while the process is alive.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Pings the database with a 2s timeout to decide readiness.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready (database reachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /:
    get:
      tags: [Health]
      summary: Root placeholder
      description: Plain-text banner, not part of the API contract.
      operationId: root
      security: []
      responses:
        "200":
          description: Plain-text OK
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Creates a user and returns a JWT session token.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Register success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid payload, or email/password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stream:
    get:
      tags: [Stream]
      summary: Subscribe to real-time events (SSE)
      description: |
        Opens a Server-Sent Events (SSE) stream. The connection stays open and
        the server pushes frames scoped to the authenticated user; event names
        are a stable contract for the frontend (see the `StreamEvent` schema).

        Auth: the browser `EventSource` API cannot send an `Authorization`
        header, so the JWT is also accepted via the `token` query parameter
        (that is the variant the dashboard must use).
      operationId: streamEvents
      parameters:
        - name: token
          in: query
          description: JWT session token. Alternative to the Authorization header; required for browser EventSource.
          schema:
            type: string
      responses:
        "200":
          description: |
            Event stream. Each message is a `text/event-stream` frame shaped
            `event: <type>` + `data: <json>` separated by a blank line, plus a
            `: ping` heartbeat comment every 15s to keep connections alive.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      description: |
        Lists the caller's monitors with optional filtering, sorting and
        pagination.
      operationId: listMonitors
      description: |
        Lists the caller's monitors with optional filtering, sorting and
        pagination. Each item carries derived availability status over the
        requested `window` (uptime %, checks and average response time).
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/QQuery"
        - $ref: "#/components/parameters/ActiveQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/OrderQuery"
        - $ref: "#/components/parameters/WindowQuery"
      responses:
        "200":
          description: Paginated monitor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorListResponse"
        "400":
          description: Invalid query parameters (active, sort, order, page, limit, window)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Monitors]
      summary: Create a monitor
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorRequest"
      responses:
        "201":
          description: Created monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          description: Invalid body, or validation failed with field details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /monitors/{id}:
    parameters:
      - $ref: "#/components/parameters/MonitorIdPath"
    get:
      tags: [Monitors]
      summary: Get a monitor
      operationId: getMonitor
      description: |
        Returns the monitor with its derived availability status over the
        current window (default 24h).
      responses:
        "200":
          description: The monitor with derived status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorWithStatus"
        "400":
          description: id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Monitor does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Monitors]
      summary: Update a monitor
      description: |
        Full update: name, url, method, expected_status, interval_seconds,
        timeout_seconds and active are all overwritten; omitted fields are reset
        to their zero values.
      operationId: updateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorRequest"
      responses:
        "200":
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOk"
        "400":
          description: Invalid id, invalid body, or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Monitor does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      operationId: deleteMonitor
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOk"
        "400":
          description: id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Monitor does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /monitors/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/MonitorIdPath"
    get:
      tags: [Monitors]
      summary: Get availability metrics for a monitor
      description: |
        Returns the monitor's availability summary over the window plus a time
        series with one point per bucket. Buckets are aligned to whole hours
        (`24h`, `7d`) or whole days (`30d`, `90d`); empty buckets are filled
        with zero checks via a `LEFT JOIN`.
      operationId: getMonitorMetrics
      parameters:
        - $ref: "#/components/parameters/WindowQuery"
      responses:
        "200":
          description: Metrics summary + series over the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
        "400":
          description: Invalid id or window value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Monitor does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /monitors/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/MonitorIdPath"
    get:
      tags: [Monitors]
      summary: List check history for a monitor
      description: |
        Returns the monitor's checks, newest first (fixed ORDER BY checked_at DESC).
        The `success` filter narrows to passing/failing checks.
      operationId: listMonitorChecks
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/SuccessQuery"
      responses:
        "200":
          description: Paginated check list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckListResponse"
        "400":
          description: Invalid id, pagination, or success value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Monitor does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /incidents:
    parameters:
      - $ref: "#/components/parameters/MonitorIdQuery"
      - $ref: "#/components/parameters/PageQuery"
      - $ref: "#/components/parameters/LimitQuery"
      - $ref: "#/components/parameters/StatusQuery"
    get:
      tags: [Incidents]
      summary: List incidents
      description: |
        Lists the caller's incidents, newest first. Optional filters:
        `?monitor_id=` (UUID) and `?status=` (`active` | `resolved`).
        Pagination via `?page=`/`?limit=` with the standard envelope.
      operationId: listIncidents
      responses:
        "200":
          description: Paginated incident list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
        "400":
          description: Invalid monitor_id, status, or pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/IncidentIdPath"
    get:
      tags: [Incidents]
      summary: Get an incident
      operationId: getIncident
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          description: id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Incident does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MonitorIdPath:
      name: id
      in: path
      required: true
      description: Monitor UUID
      schema:
        type: string
        format: uuid
    IncidentIdPath:
      name: id
      in: path
      required: true
      description: Incident UUID
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      description: Page number, 1-based.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    QQuery:
      name: q
      in: query
      description: Case-insensitive substring match on the monitor name.
      schema:
        type: string
    ActiveQuery:
      name: active
      in: query
      description: Filter by active state.
      schema:
        type: boolean
    SortQuery:
      name: sort
      in: query
      description: Sort column. Whitelist enforced.
      schema:
        type: string
        enum: [name, created_at, interval_seconds]
        default: created_at
    OrderQuery:
      name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    SuccessQuery:
      name: success
      in: query
      description: Filter checks by result.
      schema:
        type: boolean
    MonitorIdQuery:
      name: monitor_id
      in: query
      description: Filter incidents by monitor UUID.
      schema:
        type: string
        format: uuid
    StatusQuery:
      name: status
      in: query
      description: Filter incidents by status.
      schema:
        type: string
        enum: [active, resolved]
    WindowQuery:
      name: window
      in: query
      description: |
        Availability time window used for `uptime`, `checks` and
        `avg_response_ms`. Bucketing: hourly for `24h`/`7d`, daily for
        `30d`/`90d`.
      schema:
        type: string
        enum: [24h, 7d, 30d, 90d]
        default: 24h

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum: [invalid_request, unauthorized, not_found, conflict, internal_error]
        message:
          type: string
        details:
          type: object
          description: Per-field validation messages; present only when a validation fails.
          additionalProperties:
            type: string

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT session token.

    StreamEvent:
      type: object
      description: |
        One SSE frame emitted over `GET /stream`. The `event` value is the
        message type; `data` is the JSON payload. Event names are a stable
        contract — mirror of `internal/stream/constants.go` — which the
        frontend can rely on for subscriptions.
      properties:
        event:
          type: string
          enum:
            - check.completed
            - incident.opened
            - incident.resolved
            - monitor.created
            - monitor.updated
            - monitor.deleted
        data:
          type: object
          description: |
            Payload per type: `check.completed` → Check; `incident.opened` /
            `incident.resolved` → Incident; `monitor.created` / `monitor.updated`
            → Monitor; `monitor.deleted` → `{"id": "<uuid>"}`.
          example:
            event: check.completed
            data:
              id: 1a2b3c4d-5e6f-7890-abcd-ef1234567890
              monitor_id: 2fc3b8ab-56d5-4393-ae3c-956aee66af4a
              response_time_ms: 25
              success: true
              checked_at: 2026-09-14T09:00:00Z

    MessageOk:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: ok

    Pagination:
      type: object
      required: [page, limit, total, has_more]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        has_more:
          type: boolean
          example: true

    MonitorRequest:
      type: object
      description: Body for create/update actions.
      required: [name, url, method, expected_status, interval_seconds, timeout_seconds]
      properties:
        name:
          type: string
        url:
          type: string
        method:
          type: string
          example: GET
        expected_status:
          type: integer
          example: 200
        interval_seconds:
          type: integer
          example: 60
        timeout_seconds:
          type: integer
          example: 5
        active:
          type: boolean
          description: Defaults to false; a monitor must opt in to be scheduled.
          default: false
        failure_threshold:
          type: integer
          description: Consecutive failures before an incident opens. Defaults to 3.
          default: 3
          minimum: 1

    Monitor:
      type: object
      required:
        - id
        - user_id
        - name
        - url
        - method
        - expected_status
        - interval_seconds
        - timeout_seconds
        - active
        - failure_threshold
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        method:
          type: string
          example: GET
        expected_status:
          type: integer
        interval_seconds:
          type: integer
        timeout_seconds:
          type: integer
        active:
          type: boolean
        next_run:
          type: string
          format: date-time
          nullable: true
          description: Next scheduled run; null when the monitor is inactive.
        failure_threshold:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MonitorWithStatus:
      type: object
      description: A monitor plus its derived availability status over the window.
      allOf:
        - $ref: "#/components/schemas/Monitor"
        - type: object
          required: [status, checks]
          properties:
            status:
              type: string
              enum: [operational, down, unknown]
            last_check_at:
              type: string
              format: date-time
              nullable: true
            last_status_code:
              type: integer
              nullable: true
            last_success:
              type: boolean
              nullable: true
            uptime:
              type: number
              format: float
              nullable: true
              description: Availability percentage over the requested window.
            avg_response_ms:
              type: number
              format: float
              nullable: true
            checks:
              type: integer
              description: Checks recorded over the requested window.

    MonitorListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonitorWithStatus"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Check:
      type: object
      required: [id, monitor_id, response_time_ms, success, checked_at]
      properties:
        id:
          type: string
          format: uuid
        monitor_id:
          type: string
          format: uuid
        status_code:
          type: integer
          nullable: true
          description: HTTP status observed; null when the request failed to connect.
        response_time_ms:
          type: integer
        success:
          type: boolean
        error:
          type: string
          nullable: true
        checked_at:
          type: string
          format: date-time

    CheckListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Metrics:
      type: object
      required: [monitor_id, window, summary, series]
      properties:
        monitor_id:
          type: string
          format: uuid
        window:
          type: string
          enum: [24h, 7d, 30d, 90d]
        summary:
          $ref: "#/components/schemas/MetricsSummary"
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricsPoint"

    MetricsSummary:
      type: object
      required: [checks, successes, failures, uptime]
      properties:
        checks:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        uptime:
          type: number
          format: float
          description: Availability percentage over the verified window.
        avg_response_ms:
          type: number
          format: float
          nullable: true
          description: Mean response time over the window; null when there is no data.
        p95_response_ms:
          type: number
          format: float
          nullable: true
          description: 95th percentile response time; 95% of checks finished faster than this.

    MetricsPoint:
      type: object
      required: [bucket, checks, uptime]
      properties:
        bucket:
          type: string
          format: date-time
          description: Bucket start, aligned to a whole hour or day.
        checks:
          type: integer
        uptime:
          type: number
          format: float
        avg_response_ms:
          type: number
          format: float
          nullable: true

    Incident:
      type: object
      required: [id, monitor_id, started_at, status, failure_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        monitor_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, resolved]
        failure_count:
          type: integer
        created_at:
          type: string
          format: date-time

    IncidentListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        pagination:
          $ref: "#/components/schemas/Pagination"